[package]
name = "ltsc_setup_gui"
version = "2.1.0"
edition = "2021"
authors = ["Antigravity AI"]
description = "Cancellable Rust-native Windows LTSC workstation deployer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
include_dir = "0.7"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
winreg = "0.52"

[build-dependencies]
winresource = "0.1.31"

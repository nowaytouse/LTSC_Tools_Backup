[package]
name = "ltsc_setup_gui"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity AI"]
description = "One-Click Windows LTSC Setup & Environment Customizer GUI in Rust"

[dependencies]
eframe = "0.29.1"
egui = "0.29.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
include_dir = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

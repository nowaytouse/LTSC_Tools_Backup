name: LTSC Workspace CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  macos-inventory-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - name: Verify every configured provider package
        run: cargo run --bin profile_audit
      - run: cargo build --release --bin ltsc_setup_gui
      - name: Verify standalone Windows artifact
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("target/release/ltsc_setup_gui.exe")
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -match "VCRUNTIME[0-9_]*\.dll") {
            throw "Windows artifact still depends on a dynamic VC runtime"
          }
          if (-not $ascii.Contains("requireAdministrator")) {
            throw "Windows artifact is missing its embedded UAC manifest"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: ltsc_setup_gui-windows-x64
          path: target/release/ltsc_setup_gui.exe
          if-no-files-found: error

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
